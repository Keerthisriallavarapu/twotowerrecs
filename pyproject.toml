[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "twotowerrecs"
version = "0.1.0"
description = "Two-tower retrieval model with FAISS serving on MovieLens"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
  "torch>=2.5.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "faiss-cpu>=1.8.0",  # CPU; for GPU swap to faiss-gpu manually
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "tqdm>=4.66.0",
  "structlog>=24.4.0",
  "typer>=0.12.0",
  "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
ttr = "twotowerrecs.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["twotowerrecs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
